[package]
name = "openjack"
version = "0.1.0"
description = "OpenJack lottery program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "openjack"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
